spring.application.name=streaming
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# 테스트는 로컬 Redis의 15번 DB를 써서 개발 데이터와 섞이지 않게 한다
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=15


# 운영 설정과 같게 끈다 (트랜잭션 밖 지연 로딩이 있으면 테스트에서 LazyInitializationException으로 드러난다)
spring.jpa.open-in-view=false

# 테스트 전용 키 (운영 키 아님)
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzISE=
jwt.access-token-expiration=1800
