spring.application.name=streaming
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# 부하테스트(15번)와 통합 테스트(14번)의 Redis 데이터를 분리한다
spring.data.redis.host=${REDIS_TEST_HOST:localhost}
spring.data.redis.port=${REDIS_TEST_PORT:6379}
spring.data.redis.database=${REDIS_TEST_DATABASE:14}


# 운영 설정과 같게 끈다 (트랜잭션 밖 지연 로딩이 있으면 테스트에서 LazyInitializationException으로 드러난다)
spring.jpa.open-in-view=false

# 테스트 전용 키 (운영 키 아님)
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzISE=
jwt.access-token-expiration=1800
