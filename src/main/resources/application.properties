spring.application.name=streaming
# DB 비밀번호, JWT 키는 프로젝트 루트의 .env에서 읽는다 (.env.example 참고)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/streaming?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Actuator
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Tomcat 스레드 지표(tomcat.threads.busy 등)는 MBean 레지스트리가 켜져 있어야 수집된다
server.tomcat.mbeanregistry.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# 영속성 컨텍스트(와 DB 커넥션)를 요청 끝까지 붙잡지 않도록 끈다. 지연 로딩은 트랜잭션 안에서만 쓴다
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=1800