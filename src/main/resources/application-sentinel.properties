# Sentinel이 관리하는 논리적 Primary 이름. sentinel.conf의 monitor 이름과 같아야 한다.
spring.data.redis.sentinel.master=${REDIS_SENTINEL_MASTER:streaming-master}
spring.data.redis.sentinel.nodes=${REDIS_SENTINEL_NODES:redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379}

# Redis 데이터 노드와 Sentinel 인증은 별도 자격증명을 사용한다.
spring.data.redis.password=${REDIS_PASSWORD:streaming-redis-dev}
spring.data.redis.sentinel.password=${REDIS_SENTINEL_PASSWORD:streaming-sentinel-dev}

# Failover 중 요청 스레드를 오래 점유하지 않고 503으로 빠르게 실패한다.
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=2s
