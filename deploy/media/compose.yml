name: streaming-media
services:
  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.21.4}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIA_PUBLIC_IP:?Set MEDIA_PUBLIC_IP}
      MTX_AUTHINTERNALUSERS_0_USER: publisher
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_PUBLISH_PASSWORD:?Set publisher password}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_1_USER: viewer
      MTX_AUTHINTERNALUSERS_1_PASS: ${MEDIAMTX_READ_PASSWORD:?Set viewer password}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: read
      MTX_AUTHINTERNALUSERS_2_USER: monitor
      MTX_AUTHINTERNALUSERS_2_PASS: ${MEDIAMTX_MONITOR_PASSWORD:?Set monitor password}
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: api
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro,Z
    # Open external media traffic after TLS and admission authorization are ready.
    ports:
      - 127.0.0.1:1935:1935
      - 127.0.0.1:8889:8889
      - 127.0.0.1:8189:8189/udp
      - 127.0.0.1:9997:9997
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 1g
