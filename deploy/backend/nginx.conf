events {}
http {
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 80;
        client_max_body_size 1m;
        location /actuator { return 404; }
        location /internal/ { return 404; }
        location / {
            set $backend http://app:8080;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
    # Private callback listener. This port serves no application or management routes.
    server {
        listen 81 ssl;
        ssl_certificate /etc/streaming/media-auth/tls.crt;
        ssl_certificate_key /etc/streaming/media-auth/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16k;
        access_log off;
        location = /internal/media/auth {
            set $backend http://app:8080;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }
        location / { return 404; }
    }
}
