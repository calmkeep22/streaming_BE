name: Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REQUIRE_REDIS_TESTS: 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: bash ./gradlew test --no-daemon --max-workers=2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test loadtest/test/config.test.mjs loadtest/test/metrics.test.mjs loadtest/test/suite.test.mjs
      - name: Verify deployment scripts and Compose files
        run: |
          for script in deploy/scripts/*.sh deploy/backend/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy/tests -v
          APP_IMAGE=streaming:test docker compose --env-file deploy/backend/.env.example -f deploy/backend/compose.yml config --quiet
          docker compose --env-file deploy/media/.env.example -f deploy/media/compose.yml config --quiet
      - name: Prepare Docker build verification
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Verify application image builds
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
