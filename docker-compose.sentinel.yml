name: streaming-sentinel

services:
  mysql:
    image: mysql:8.0.44
    environment:
      MYSQL_DATABASE: streaming
      MYSQL_USER: streaming
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-streaming-mysql-dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-streaming-root-dev}
    ports:
      - "3307:3306"
    volumes:
      - sentinel-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ustreaming -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis-primary:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-streaming-redis-dev}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --requirepass "$${REDIS_PASSWORD}"
        --masterauth "$${REDIS_PASSWORD}"
        --maxmemory "$${REDIS_MAXMEMORY}"
        --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - sentinel-redis-primary-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.29.0.10

  redis-replica:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-streaming-redis-dev}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --replicaof redis-primary 6379
        --requirepass "$${REDIS_PASSWORD}"
        --masterauth "$${REDIS_PASSWORD}"
        --maxmemory "$${REDIS_MAXMEMORY}"
        --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - sentinel-redis-replica-data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.29.0.11

  redis-sentinel-1:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-streaming-redis-dev}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-streaming-sentinel-dev}
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/sentinel.conf ]; then cat > /data/sentinel.conf <<EOF
        port 26379
        sentinel monitor streaming-master 172.29.0.10 6379 2
        sentinel auth-pass streaming-master $${REDIS_PASSWORD}
        sentinel down-after-milliseconds streaming-master 3000
        sentinel failover-timeout streaming-master 10000
        sentinel parallel-syncs streaming-master 1
        requirepass $${REDIS_SENTINEL_PASSWORD}
        EOF
        fi
        exec redis-server /data/sentinel.conf --sentinel
    ports:
      - "26379:26379"
    volumes:
      - sentinel-redis-sentinel-1-data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_SENTINEL_PASSWORD}\" -p 26379 ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-streaming-redis-dev}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-streaming-sentinel-dev}
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/sentinel.conf ]; then cat > /data/sentinel.conf <<EOF
        port 26379
        sentinel monitor streaming-master 172.29.0.10 6379 2
        sentinel auth-pass streaming-master $${REDIS_PASSWORD}
        sentinel down-after-milliseconds streaming-master 3000
        sentinel failover-timeout streaming-master 10000
        sentinel parallel-syncs streaming-master 1
        requirepass $${REDIS_SENTINEL_PASSWORD}
        EOF
        fi
        exec redis-server /data/sentinel.conf --sentinel
    ports:
      - "26380:26379"
    volumes:
      - sentinel-redis-sentinel-2-data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_SENTINEL_PASSWORD}\" -p 26379 ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-streaming-redis-dev}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-streaming-sentinel-dev}
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/sentinel.conf ]; then cat > /data/sentinel.conf <<EOF
        port 26379
        sentinel monitor streaming-master 172.29.0.10 6379 2
        sentinel auth-pass streaming-master $${REDIS_PASSWORD}
        sentinel down-after-milliseconds streaming-master 3000
        sentinel failover-timeout streaming-master 10000
        sentinel parallel-syncs streaming-master 1
        requirepass $${REDIS_SENTINEL_PASSWORD}
        EOF
        fi
        exec redis-server /data/sentinel.conf --sentinel
    ports:
      - "26381:26379"
    volumes:
      - sentinel-redis-sentinel-3-data:/data
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_SENTINEL_PASSWORD}\" -p 26379 ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: loadtest,sentinel
      DB_URL: jdbc:mysql://mysql:3306/streaming?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul
      DB_USERNAME: streaming
      DB_PASSWORD: ${MYSQL_PASSWORD:-streaming-mysql-dev}
      JWT_SECRET: ${JWT_SECRET:-dGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVzISE=}
      PAYMENT_GATEWAY: fake
      METRICS_ENVIRONMENT: sentinel-local
      REDIS_PASSWORD: ${REDIS_PASSWORD:-streaming-redis-dev}
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-streaming-sentinel-dev}
      REDIS_SENTINEL_MASTER: streaming-master
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      redis-sentinel-2:
        condition: service_healthy
      redis-sentinel-3:
        condition: service_healthy
    restart: unless-stopped

  redis-primary-exporter:
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://redis-primary:6379
      # 죽은 Redis에 오래 붙잡혀 Prometheus 스크랩(5초)을 넘기지 않도록 짧게 둔다. 그래야 exporter는 up=1, redis_up=0으로 보고한다
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 2s
      REDIS_PASSWORD: ${REDIS_PASSWORD:-streaming-redis-dev}
      REDIS_EXPORTER_APPEND_INSTANCE_ROLE_LABEL: "true"
    ports:
      - "9121:9121"
    depends_on:
      redis-primary:
        condition: service_healthy
    restart: unless-stopped

  redis-replica-exporter:
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://redis-replica:6379
      # 죽은 Redis에 오래 붙잡혀 Prometheus 스크랩(5초)을 넘기지 않도록 짧게 둔다. 그래야 exporter는 up=1, redis_up=0으로 보고한다
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 2s
      REDIS_PASSWORD: ${REDIS_PASSWORD:-streaming-redis-dev}
      REDIS_EXPORTER_APPEND_INSTANCE_ROLE_LABEL: "true"
    ports:
      - "9122:9121"
    depends_on:
      redis-replica:
        condition: service_healthy
    restart: unless-stopped

  redis-sentinel-1-exporter:
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://redis-sentinel-1:26379
      # 죽은 Redis에 오래 붙잡혀 Prometheus 스크랩(5초)을 넘기지 않도록 짧게 둔다. 그래야 exporter는 up=1, redis_up=0으로 보고한다
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 2s
      REDIS_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-streaming-sentinel-dev}
    ports:
      - "9131:9121"
    depends_on:
      redis-sentinel-1:
        condition: service_healthy
    restart: unless-stopped

  redis-sentinel-2-exporter:
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://redis-sentinel-2:26379
      # 죽은 Redis에 오래 붙잡혀 Prometheus 스크랩(5초)을 넘기지 않도록 짧게 둔다. 그래야 exporter는 up=1, redis_up=0으로 보고한다
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 2s
      REDIS_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-streaming-sentinel-dev}
    ports:
      - "9132:9121"
    depends_on:
      redis-sentinel-2:
        condition: service_healthy
    restart: unless-stopped

  redis-sentinel-3-exporter:
    image: oliver006/redis_exporter:v1.95.0
    environment:
      REDIS_ADDR: redis://redis-sentinel-3:26379
      # 죽은 Redis에 오래 붙잡혀 Prometheus 스크랩(5초)을 넘기지 않도록 짧게 둔다. 그래야 exporter는 up=1, redis_up=0으로 보고한다
      REDIS_EXPORTER_CONNECTION_TIMEOUT: 2s
      REDIS_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-streaming-sentinel-dev}
    ports:
      - "9133:9121"
    depends_on:
      redis-sentinel-3:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - sentinel-prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_started
      redis-primary-exporter:
        condition: service_started
      redis-replica-exporter:
        condition: service_started
      redis-sentinel-1-exporter:
        condition: service_started
      redis-sentinel-2-exporter:
        condition: service_started
      redis-sentinel-3-exporter:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - sentinel-alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-streaming-grafana-dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - sentinel-grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  sentinel-mysql-data:
  sentinel-redis-primary-data:
  sentinel-redis-replica-data:
  sentinel-redis-sentinel-1-data:
  sentinel-redis-sentinel-2-data:
  sentinel-redis-sentinel-3-data:
  sentinel-prometheus-data:
  sentinel-alertmanager-data:
  sentinel-grafana-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
